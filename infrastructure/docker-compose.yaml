version: '3.8'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: nexus-redpanda
    command:
      - redpanda start
      - --smp 1 --memory 1G --reserve-memory 0M --overprovisioned
      - --node-id 0 --check=false
      - --kafka-addr PLAIN://0.0.0.0:9092,OUTSIDE://0.0.0.0:29092
      - --advertise-kafka-addr PLAIN://redpanda:9092,OUTSIDE://localhost:29092
    ports:
      - 29092:29092

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: nexus-console
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - 8080:8080
    depends_on: [redpanda]

  redis:
    image: redis:alpine
    container_name: nexus-redis
    ports:
      - 6379:6379

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus